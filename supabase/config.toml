# Configuración de la CLI de Supabase.
# El project_id del proyecto en la nube se asocia con `npx supabase link --project-ref <ref>`.
project_id = "sistema-el-apache"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
enabled = true
site_url = "https://el-apache-bebidas.nexuss-mktdigital.workers.dev"
additional_redirect_urls = ["http://localhost:5173", "https://el-apache-bebidas.nexuss-mktdigital.workers.dev"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Sin registro abierto: los usuarios los crea NEXUSS.
enable_signup = false
enable_anonymous_sign_ins = false
minimum_password_length = 8

[auth.email]
enable_signup = false
enable_confirmations = false
double_confirm_changes = false
